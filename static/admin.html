<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - S4Fashion</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --primary-indigo: #4f46e5;
            --primary-hover: #4338ca;
            --border-color: #e2e8f0;
            --shadow-subtle: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-card: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--slate-50);
            color: var(--slate-800);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER */
        .main-header {
            background-color: var(--slate-900);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-wrapper {
            text-decoration: none;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .logo-subtext {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo-subtext span {
            color: #6366f1;
        }

        /* CARDS & STATS */
        .stat-card {
            background: #ffffff;
            padding: 20px 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-subtle);
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-card);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 4px;
        }

        .stat-card.revenue::before { background-color: #4f46e5; }
        .stat-card.orders::before { background-color: #10b981; }
        .stat-card.items::before { background-color: #f59e0b; }
        .stat-card.customers::before { background-color: #8b5cf6; }

        /* FORM CONTROLS */
        .form-card {
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: var(--shadow-subtle);
            border: 1px solid var(--border-color);
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--slate-700);
            margin-bottom: 6px;
            display: block;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #ffffff;
            color: var(--slate-800);
            transition: all 0.2s ease;
            box-sizing: border-box;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-indigo);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        .btn-primary {
            background-color: var(--primary-indigo);
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="main-header">
        <div class="header-container">
            <a href="/" class="logo-wrapper">
                <span class="logo-text">S4Fashion</span>
                <span class="logo-subtext">Admin <span>Portal</span></span>
            </a>
            <div style="display: flex; align-items: center; gap: 20px;">
                <span id="admin-user-display" style="color: #cbd5e1; font-size: 13px; font-weight: 500;"></span>
                <a href="/" style="color: #818cf8; font-size: 13px; font-weight: 600; text-decoration: none; transition: color 0.2s;">View Storefront</a>
                <button onclick="logoutUser()" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 6px 14px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: background 0.2s;">Logout</button>
            </div>
        </div>
    </header>

    <main style="max-width: 1280px; width: 100%; margin: 32px auto; padding: 0 24px; box-sizing: border-box; flex: 1;">
        <div style="margin-bottom: 28px;">
            <h1 style="font-size: 26px; font-weight: 800; color: var(--slate-900); letter-spacing: -0.5px;">Merchant Administration & Inventory Control</h1>
            <p style="font-size: 14px; color: #64748b; margin-top: 6px;">Protected by Role-Based Access Control (RBAC CWE-284). Customer accounts are strictly restricted.</p>
        </div>

        <!-- ANALYTICS TILES -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px;">
            <div class="stat-card revenue">
                <div style="font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">Total Revenue</div>
                <div id="stat-revenue" style="font-size: 28px; font-weight: 800; color: var(--slate-900); margin-top: 8px;">₹0</div>
            </div>

            <div class="stat-card orders">
                <div style="font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">Orders Processed</div>
                <div id="stat-orders" style="font-size: 28px; font-weight: 800; color: var(--slate-900); margin-top: 8px;">0</div>
            </div>

            <div class="stat-card items">
                <div style="font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">Catalog Items</div>
                <div id="stat-items" style="font-size: 28px; font-weight: 800; color: var(--slate-900); margin-top: 8px;">0</div>
            </div>

            <div class="stat-card customers">
                <div style="font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">Registered Customers</div>
                <div id="stat-customers" style="font-size: 28px; font-weight: 800; color: var(--slate-900); margin-top: 8px;">0</div>
            </div>
        </div>

        <!-- ADD NEW PRODUCT FORM -->
        <div class="form-card">
            <h2 style="font-size: 16px; font-weight: 700; text-transform: uppercase; color: var(--slate-900); margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 14px; letter-spacing: 0.5px;">
                Add New Apparel Item to Catalog
            </h2>

            <form id="admin-add-product-form" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div style="grid-column: 1 / -1;">
                    <label class="form-label">Product Title</label>
                    <input type="text" id="p-title" class="form-control" required placeholder="e.g. S4Fashion Dark Charcoal Slim Fit Blazer">
                </div>

                <div style="grid-column: 1 / -1;">
                    <label class="form-label">Detailed Description</label>
                    <textarea id="p-desc" class="form-control" required placeholder="Fabric blend, occasion suitability, fit style"></textarea>
                </div>

                <div>
                    <label class="form-label">Brand Name</label>
                    <input type="text" id="p-brand" class="form-control" required placeholder="e.g. S4Fashion Studio, Raymond, FabIndia">
                </div>

                <div>
                    <label class="form-label">Category</label>
                    <select id="p-cat" class="form-control" required>
                        <option value="men">Men's Wear</option>
                        <option value="women">Women's Wear</option>
                        <option value="kids">Kids' Wear</option>
                    </select>
                </div>

                <div>
                    <label class="form-label">Subcategory</label>
                    <input type="text" id="p-subcat" class="form-control" required placeholder="e.g. Traditional, Modern, Kurtis, Short Tops">
                </div>

                <div>
                    <label class="form-label">Available Sizes (comma-separated)</label>
                    <input type="text" id="p-sizes" class="form-control" required value="S,M,L,XL,XXL">
                </div>

                <div>
                    <label class="form-label">Available Colors (comma-separated)</label>
                    <input type="text" id="p-colors" class="form-control" required value="Navy Blue,Black,White">
                </div>

                <div>
                    <label class="form-label">Material / Fabric</label>
                    <input type="text" id="p-mat" class="form-control" placeholder="e.g. 100% Combed Cotton">
                </div>

                <div>
                    <label class="form-label">Selling Price (₹)</label>
                    <input type="number" id="p-price" class="form-control" required min="1" step="0.5" placeholder="1499">
                </div>

                <div>
                    <label class="form-label">Original MRP Price (₹)</label>
                    <input type="number" id="p-orig-price" class="form-control" min="1" step="0.5" placeholder="2499">
                </div>

                <div>
                    <label class="form-label">Initial Inventory Stock Units</label>
                    <input type="number" id="p-stock" class="form-control" required min="0" value="50">
                </div>

                <div>
                    <label class="form-label">Image URL</label>
                    <input type="url" id="p-img" class="form-control" placeholder="https://images.unsplash.com/...">
                </div>

                <div style="grid-column: 1 / -1; margin-top: 8px;">
                    <button type="submit" id="btn-add-p" class="btn-primary" style="width: 220px;">Publish Product</button>
                </div>
            </form>
        </div>
    </main>

    <script src="/js/core.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            if (!appState.token || !appState.user || appState.user.role !== "admin") {
                alert("Access Denied: Administrator role required.");
                window.location.href = "/login.html";
                return;
            }

            document.getElementById("admin-user-display").innerText = `Logged in: ${appState.user.username} (Admin)`;

            // Load Analytics
            try {
                const res = await fetch("/api/v1/admin/stats", {
                    headers: { "Authorization": `Bearer ${appState.token}` }
                });

                if (res.ok) {
                    const stats = await res.json();
                    document.getElementById("stat-revenue").innerText = `₹${stats.total_revenue.toFixed(0)}`;
                    document.getElementById("stat-orders").innerText = stats.total_orders_placed;
                    document.getElementById("stat-items").innerText = stats.active_catalog_items;
                    document.getElementById("stat-customers").innerText = stats.registered_customers;
                }
            } catch (err) {
                console.error("Failed to load admin metrics", err);
            }
        });

        document.getElementById("admin-add-product-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btn-add-p");
            btn.disabled = true;
            btn.innerText = "Publishing...";

            const payload = {
                title: document.getElementById("p-title").value.trim(),
                description: document.getElementById("p-desc").value.trim(),
                brand: document.getElementById("p-brand").value.trim(),
                category: document.getElementById("p-cat").value,
                subcategory: document.getElementById("p-subcat").value.trim(),
                available_sizes: document.getElementById("p-sizes").value.trim(),
                available_colors: document.getElementById("p-colors").value.trim(),
                material: document.getElementById("p-mat").value.trim(),
                price: parseFloat(document.getElementById("p-price").value),
                original_price: parseFloat(document.getElementById("p-orig-price").value) || null,
                stock: parseInt(document.getElementById("p-stock").value, 10),
                image_url: document.getElementById("p-img").value.trim() || null
            };

            try {
                const res = await fetch("/api/v1/admin/products", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${appState.token}`
                    },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (!res.ok) {
                    alert(`Failed to add product: ${data.message || data.error}`);
                    btn.disabled = false;
                    btn.innerText = "Publish Product";
                    return;
                }

                alert(`Product "${data.title}" successfully added to inventory!`);
                window.location.reload();
            } catch (err) {
                alert("Network communication error.");
                btn.disabled = false;
                btn.innerText = "Publish Product";
            }
        });
    </script>
</body>
</html>
