<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - S4 Fashions</title>
    <link rel="stylesheet" href="/css/modern.css">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- 1. HEADER NAVIGATION -->
    <header class="s4-nav">
        <div class="nav-wrap">
            <a href="/" class="nav-brand">
                S4 Fashions <span class="sub-brand">Fashion Hub</span>
            </a>

            <!-- Search Bar -->
            <div class="nav-search-bar">
                <svg class="nav-search-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <input type="text" class="search-field" placeholder="Search for items, brands...">
            </div>

            <!-- Actions -->
            <div class="nav-actions">
                <div id="user-profile-slot" style="position: relative;"></div>
                <a href="/cart.html" class="nav-btn primary-btn">
                    Bag <span class="nav-cart-badge" id="nav-cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN PDP LAYOUT -->
    <main class="meesho-pdp-layout" id="meesho-pdp-container">
        <div style="grid-column: 1/-1; text-align: center; padding: 60px;">
            <p>Loading item details...</p>
        </div>
    </main>

    <footer class="s4-site-footer" style="background: #8e0d5d; border-top: 1px solid #731e48; padding: 24px; text-align: center; margin-top: 40px; color: #ffffff;">
        <p style="font-size: 15px; font-weight: 600; color: #ffffff;">S4 Fashions made with love💖</p>
    </footer>

    <!-- SLIDE-OVER CUSTOMER PROFILE SIDEBAR DRAWER -->
    <div id="profile-drawer-backdrop" class="profile-sidebar-backdrop" onclick="closeProfileSidebar()"></div>
    <aside id="profile-drawer-sidebar" class="profile-sidebar-drawer">
        <div class="profile-drawer-header">
            <div style="display: flex; align-items: center; gap: 14px;">
                <div id="drawer-user-avatar" style="width: 48px; height: 48px; border-radius: 50%; background: #ffffff; color: #731e48; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
                    U
                </div>
                <div>
                    <div id="drawer-user-name" style="font-size: 16px; font-weight: 800; line-height: 1.2;">User Profile</div>
                    <div id="drawer-user-email" style="font-size: 12px; color: #ffd6ec; margin-top: 3px;">customer@s4fashions.com</div>
                </div>
            </div>
            <button type="button" class="profile-drawer-close" onclick="closeProfileSidebar()">&times;</button>
        </div>

        <div class="profile-drawer-body">
            <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px;">Account & Purchases</div>
            
            <a href="/orders.html" class="drawer-menu-item">
                <span style="font-size: 18px;">📦</span>
                <span>My Orders & Delivery Tracking</span>
            </a>

            <a href="/cart.html" class="drawer-menu-item">
                <span style="font-size: 18px;">🛍️</span>
                <span>My Shopping Bag</span>
            </a>

            <div style="height: 1px; background: #f3ecef; margin: 18px 0;"></div>

            <button onclick="logoutUser()" class="drawer-menu-item" style="width: 100%; border: none; background: none; color: #dc2626; cursor: pointer; text-align: left;">
                <span style="font-size: 18px;">🚪</span>
                <span>Sign Out Account</span>
            </button>
        </div>
    </aside>

    <script src="/js/core.js"></script>
    <script>
        let currentProduct = null;
        let selectedSize = null;
        let selectedColor = null;

        document.addEventListener("DOMContentLoaded", async () => {
            updateCartCounter();
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get("id");

            if (!productId) {
                window.location.href = "/";
                return;
            }

            try {
                const res = await fetch(`/api/v1/products/${productId}`);
                if (!res.ok) throw new Error("Not found");
                currentProduct = await res.json();
                renderMeeshoPDP(currentProduct);
            } catch (err) {
                document.getElementById("meesho-pdp-container").innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 60px;">
                        <h3>Item Not Found</h3>
                        <p style="margin-top: 10px;"><a href="/" style="color: var(--meesho-pink);">Back to Meesho Store</a></p>
                    </div>
                `;
            }
        });

        function renderMeeshoPDP(p) {
            const sizes = p.available_sizes.split(",").map(s => s.trim());
            const colors = p.available_colors.split(",").map(c => c.trim());
            selectedSize = sizes[0];
            selectedColor = colors[0];

            const discount = p.original_price && p.original_price > p.price
                ? Math.round(((p.original_price - p.price) / p.original_price) * 100)
                : 0;

            const container = document.getElementById("meesho-pdp-container");
            container.innerHTML = `
                <!-- LEFT IMAGE & BUTTONS -->
                <div class="pdp-left-box">
                    <div class="pdp-big-image">
                        <img src="${p.image_url}" alt="${escapeHtml(p.title)}">
                    </div>
                    <div class="pdp-cta-row">
                        <button id="btn-add-to-cart" class="btn-meesho-cart" onclick="handleAddToCart()">
                            Add to Cart
                        </button>
                        <button class="btn-meesho-buy" onclick="handleBuyNow()">
                            Buy Now
                        </button>
                    </div>
                </div>

                <!-- RIGHT PRODUCT DETAILS -->
                <div class="pdp-right-box">
                    <div class="pdp-card-section">
                        <h1 class="pdp-main-title">${escapeHtml(p.brand)} - ${escapeHtml(p.title)}</h1>
                        
                        <div class="pdp-price-row">
                            <span class="pdp-current-price">₹${p.price.toFixed(0)}</span>
                            ${p.original_price ? `<span class="pdp-mrp-price">₹${p.original_price.toFixed(0)}</span>` : ''}
                            ${discount > 0 ? `<span class="pdp-discount-rate">${discount}% off</span>` : ''}
                        </div>

                        <div class="free-delivery-badge">Free Delivery</div>

                        <div class="card-rating-strip" style="margin-top: 8px;">
                            <span class="rating-chip">
                                <span>${p.rating}</span>
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                            </span>
                            <span class="rating-count">${p.rating_count} Customer Ratings</span>
                        </div>
                    </div>

                    <!-- SELECT SIZE -->
                    <div class="pdp-card-section">
                        <div style="font-size: 15px; font-weight: 700; color: var(--meesho-dark); margin-bottom: 8px;">Select Size</div>
                        <div class="size-pill-row" id="size-pill-container">
                            ${sizes.map((s, idx) => `
                                <button type="button" class="size-pill ${idx === 0 ? 'selected' : ''}" onclick="selectSize('${s}', this)">${s}</button>
                            `).join("")}
                        </div>
                    </div>

                    <!-- PRODUCT SPECIFICATIONS -->
                    <div class="pdp-card-section">
                        <div style="font-size: 15px; font-weight: 700; color: var(--meesho-dark); margin-bottom: 12px;">Product Details</div>
                        <p style="font-size: 13px; color: var(--meesho-gray); line-height: 1.6; margin-bottom: 14px;">${escapeHtml(p.description)}</p>

                        <div style="display: grid; grid-template-columns: 140px 1fr; gap: 10px; font-size: 13px;">
                            <span style="color: var(--meesho-light-gray);">Category:</span>
                            <span style="text-transform: capitalize;">${escapeHtml(p.category_name || p.category || 'Apparel')} ${p.subcategory_name ? `(${escapeHtml(p.subcategory_name)})` : ''}</span>

                            <span style="color: var(--meesho-light-gray);">Fabric:</span>
                            <span>${escapeHtml(p.material || 'Cotton Blend')}</span>

                            <span style="color: var(--meesho-light-gray);">Available Colors:</span>
                            <span>${escapeHtml(p.available_colors)}</span>

                            <span style="color: var(--meesho-light-gray);">Stock Status:</span>
                            <span style="color: var(--meesho-green); font-weight: 700;">In Stock (${p.stock} units available)</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectSize(s, btn) {
            selectedSize = s;
            document.querySelectorAll(".size-pill").forEach(p => p.classList.remove("selected"));
            btn.classList.add("selected");
        }

        function handleAddToCart() {
            if (!currentProduct) return;
            addItemToCart(currentProduct, selectedSize, selectedColor, 1);
            updateCartCounter();

            // Update button state visually
            const btn = document.getElementById("btn-add-to-cart");
            if (btn) {
                btn.innerHTML = `✓ Added to Cart`;
                btn.style.background = "#768452";
                btn.style.color = "#ffffff";
                btn.style.borderColor = "#768452";
                
                // Revert back after 2.5 seconds or keep subtle indicator
                setTimeout(() => {
                    const thisItemCount = (appState.cart || []).filter(i => i.product_id === currentProduct.id).reduce((a, b) => a + (b.quantity || 1), 0);
                    btn.innerHTML = `Add to Cart (${thisItemCount} in Bag)`;
                    btn.style.background = "#ffffff";
                    btn.style.color = "var(--primary)";
                    btn.style.borderColor = "var(--primary)";
                }, 2500);
            }

            showToastPopup(
                "Added to Bag!",
                `"${currentProduct.title}" (${selectedSize}, ${selectedColor}) has been added.`,
                "/cart.html",
                "View Bag &rarr;"
            );
        }

        function handleBuyNow() {
            if (!currentProduct) return;
            addItemToCart(currentProduct, selectedSize, selectedColor, 1);
            if (!appState.token || !appState.user) {
                showToastPopup(
                    "Sign In Required",
                    "Please sign in with your account to proceed to checkout.",
                    "/login.html",
                    "Sign In &rarr;"
                );
                setTimeout(() => {
                    window.location.href = "/login.html";
                }, 1200);
                return;
            }
            window.location.href = "/cart.html";
        }
    </script>
</body>
</html>
