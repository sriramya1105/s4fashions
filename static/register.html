<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ThreadCraft Apparel</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color: var(--bg-gray);">

    <!-- HEADER -->
    <header class="main-header">
        <div class="header-container" style="justify-content: space-between;">
            <a href="/" class="logo-wrapper">
                <span class="logo-text">ThreadCraft</span>
                <span class="logo-subtext">Explore <span>Fashion</span></span>
            </a>
            <div style="font-size: 13px; color: #ffffff;">
                CS5101 Secure Coding · Customer Registration
            </div>
        </div>
    </header>

    <!-- SPLIT-SCREEN AUTH CONTAINER (FLIPKART STYLE) -->
    <div class="auth-page-container">
        
        <!-- LEFT BRAND PANEL -->
        <div class="auth-sidebar-banner">
            <div>
                <h2 class="auth-sidebar-title">Looks like you're new here!</h2>
                <p class="auth-sidebar-sub">Sign up with your details to get started with ThreadCraft apparel shopping</p>
            </div>
            <div style="font-size: 12px; color: #bed2fa; line-height: 1.6;">
                Strict Pydantic Schema Validation (CWE-20) and Parameterized Input Protection (CWE-89)
            </div>
        </div>

        <!-- RIGHT FORM PANEL -->
        <div class="auth-form-container">
            <div id="register-alert" style="display: none; padding: 10px 14px; background-color: #fde8e8; color: #9b1c1c; font-size: 13px; border-radius: 2px; margin-bottom: 16px;"></div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="fullname" class="form-control" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="reg-username" class="form-control" required placeholder="Pick a username (alphanumeric)" pattern="^[a-zA-Z0-9_-]{3,30}$">
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" required placeholder="Enter valid email address">
                </div>

                <div class="form-group">
                    <label class="form-label">Password (min 8 characters)</label>
                    <input type="password" id="reg-password" class="form-control" required minlength="8" placeholder="Create strong password">
                </div>

                <button type="submit" id="btn-submit-reg" class="btn-auth-primary">CONTINUE</button>
            </form>

            <a href="/login.html" class="auth-toggle-link">
                Existing User? Log in
            </a>
        </div>

    </div>

    <script src="/js/core.js"></script>
    <script>
        document.getElementById("register-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById("register-alert");
            const btn = document.getElementById("btn-submit-reg");

            const fullName = document.getElementById("fullname").value.trim();
            const username = document.getElementById("reg-username").value.trim();
            const email = document.getElementById("reg-email").value.trim();
            const password = document.getElementById("reg-password").value;

            alertBox.style.display = "none";
            btn.disabled = true;
            btn.innerText = "Creating Account...";

            try {
                const res = await fetch("/api/v1/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        full_name: fullName,
                        username: username,
                        email: email,
                        password: password
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    alertBox.style.display = "block";
                    alertBox.innerText = data.message || data.error || "Registration failed.";
                    btn.disabled = false;
                    btn.innerText = "CONTINUE";
                    return;
                }

                alert("Account created successfully! Please log in.");
                window.location.href = "/login.html";
            } catch (err) {
                alertBox.style.display = "block";
                alertBox.innerText = "Network connection failed. Ensure server is active.";
                btn.disabled = false;
                btn.innerText = "CONTINUE";
            }
        });
    </script>
</body>
</html>
