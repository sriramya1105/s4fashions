<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Register - Meesho Fashion</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background-color: #fcf4fb;">

    <!-- TOP HEADER -->
    <header class="meesho-top-header">
        <div class="header-inner" style="justify-content: space-between;">
            <a href="/" class="brand-meesho">
                <span class="brand-title">S4 Fashions</span>
                <span class="brand-subtitle">Women · Men · Kids</span>
            </a>
            <div style="font-size: 13px; color: var(--meesho-pink); font-weight: 600;">
                CS5101 Secure Authentication
            </div>
        </div>
    </header>

    <!-- MEESHO AUTH CARD -->
    <div class="meesho-auth-container">
        <div class="meesho-auth-logo">Sign In to Meesho</div>
        <div class="meesho-auth-sub">To view your wishlist, orders, and personalized apparel feed</div>

        <div id="login-alert" style="display: none; padding: 10px 14px; background-color: #fde8e8; color: #9b1c1c; font-size: 13px; border-radius: 4px; margin-bottom: 16px;"></div>

        <form id="meesho-login-form">
            <div class="meesho-input-group">
                <label class="meesho-label">Username</label>
                <input type="text" id="username" class="meesho-input" required placeholder="Enter username" autocomplete="username">
            </div>

            <div class="meesho-input-group">
                <label class="meesho-label">Password</label>
                <input type="password" id="password" class="meesho-input" required placeholder="Enter password" autocomplete="current-password">
            </div>

            <button type="submit" id="btn-login-submit" class="btn-meesho-primary">Continue</button>
        </form>

        <div style="text-align: center; margin-top: 18px; font-size: 13px;">
            <a href="/register.html" style="color: var(--meesho-pink); text-decoration: none; font-weight: 700;">
                New to Meesho? Create an Account
            </a>
        </div>

        <!-- Testing accounts shortcut -->
        <div style="margin-top: 24px; padding: 12px; background: #fafafa; border: 1px dashed #dcdcdc; border-radius: 4px; font-size: 12px;">
            <div style="font-weight: 700; color: var(--meesho-dark); margin-bottom: 6px;">Evaluation Accounts:</div>
            <div style="display: flex; gap: 8px;">
                <button type="button" onclick="fillDemo('alice_customer', 'AlicePassword123!')" style="background: var(--meesho-light-pink); color: var(--meesho-pink); border: 1px solid var(--meesho-pink); padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 600;">
                    Customer (Alice)
                </button>
                <button type="button" onclick="fillDemo('admin_user', 'Admin@ThreadCraft2026!')" style="background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 600;">
                    Admin Manager
                </button>
            </div>
        </div>
    </div>

    <script src="/js/core.js"></script>
    <script>
        function fillDemo(u, p) {
            document.getElementById("username").value = u;
            document.getElementById("password").value = p;
        }

        document.getElementById("meesho-login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById("login-alert");
            const btn = document.getElementById("btn-login-submit");
            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value;

            alertBox.style.display = "none";
            btn.disabled = true;
            btn.innerText = "Signing in...";

            try {
                const res = await fetch("/api/v1/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: u, password: p })
                });

                const data = await res.json();
                if (!res.ok) {
                    alertBox.style.display = "block";
                    alertBox.innerText = data.message || data.error || "Authentication failed.";
                    btn.disabled = false;
                    btn.innerText = "Continue";
                    return;
                }

                localStorage.setItem("tc_token", data.access_token);
                localStorage.setItem("tc_user", JSON.stringify(data.user));

                if (data.user.role === "admin") {
                    window.location.href = "/admin_portal/index.html";
                } else {
                    window.location.href = "/";
                }
            } catch (err) {
                alertBox.style.display = "block";
                alertBox.innerText = "Connection failed. Please ensure backend is active.";
                btn.disabled = false;
                btn.innerText = "Continue";
            }
        });
    </script>
</body>
</html>
