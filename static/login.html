<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - S4 Fashions</title>
    <link rel="stylesheet" href="/css/modern.css?v=20261117_3">
    <link rel="stylesheet" href="/css/style.css?v=20261117_3">
</head>
<body style="background-color: #fcf4fb;">

    <!-- TOP HEADER -->
    <header class="meesho-top-header">
        <div class="header-inner" style="justify-content: space-between;">
            <a href="/" class="brand-meesho">
                <span class="brand-title">S4 Fashions</span>
                <span class="brand-subtitle">Women · Men · Kids</span>
            </a>
        </div>
    </header>

    <!-- MEESHO AUTH CARD -->
    <div class="meesho-auth-container">
        <div class="meesho-auth-logo">Sign In to S4 Fashions</div>
        <div class="meesho-auth-sub">Sign in to access your orders and shopping bag</div>

        <div id="login-alert" style="display: none; padding: 10px 14px; background-color: #fde8e8; color: #9b1c1c; font-size: 13px; border-radius: 4px; margin-bottom: 16px;"></div>

        <form id="meesho-login-form">
            <div class="meesho-input-group">
                <label class="meesho-label">Username</label>
                <input type="text" id="username" class="meesho-input" required placeholder="Enter username" autocomplete="username">
            </div>

            <div class="meesho-input-group">
                <label class="meesho-label">Password</label>
                <input type="password" id="password" class="meesho-input" required placeholder="Enter password" autocomplete="current-password">
            </div>

            <button type="submit" id="btn-login-submit" class="btn-meesho-primary">Continue</button>
        </form>

        <div style="text-align: center; margin-top: 18px; font-size: 13px;">
            <a href="/register.html" style="color: var(--meesho-pink); text-decoration: none; font-weight: 700;">
                New Customer? Create an Account
            </a>
        </div>
    </div>

    <script src="/js/core.js?v=20261117_3"></script>
    <script>
        document.getElementById("meesho-login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById("login-alert");
            const btn = document.getElementById("btn-login-submit");
            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value;

            alertBox.style.display = "none";
            btn.disabled = true;
            btn.innerText = "Signing in...";

            try {
                const res = await fetch("/api/v1/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: u, password: p })
                });

                const data = await res.json();
                if (!res.ok) {
                    alertBox.style.display = "block";
                    alertBox.innerText = data.message || data.error || "Authentication failed.";
                    btn.disabled = false;
                    btn.innerText = "Continue";
                    return;
                }

                localStorage.setItem("tc_token", data.access_token);
                localStorage.setItem("tc_user", JSON.stringify(data.user));
                localStorage.setItem("tc_login_time", Date.now().toString());

                if (data.user.role === "admin") {
                    window.location.href = "/admin_portal/index.html";
                } else {
                    window.location.href = "/";
                }
            } catch (err) {
                alertBox.style.display = "block";
                alertBox.innerText = "Connection failed. Please ensure backend is active.";
                btn.disabled = false;
                btn.innerText = "Continue";
            }
        });
    </script>
</body>
</html>
